name: henyard_daily
description: "Henyard Daily — a warm habit companion that runs with you."
publish_to: 'none'

version: 1.0.2+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Reactive state + on-device persistence (fully offline).
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Presentation / design system helpers.
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  flutter_slidable: ^4.0.0
  smooth_page_indicator: ^1.2.0
  percent_indicator: ^4.2.5
  shimmer: ^3.0.0
  fl_chart: ^1.1.1
  table_calendar: ^3.2.0
  confetti: ^0.8.0

  # Platform features.
  intl: ^0.20.2
  image_picker: ^1.1.2
  webview_flutter: ^4.13.0
  pedometer: ^4.2.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/henyard_mark.png"
  adaptive_icon_background: "#02311D"
  adaptive_icon_foreground: "assets/henyard_mark_fg.png"
  adaptive_icon_monochrome: "assets/henyard_mark_mono.png"
  min_sdk_android: 23
  remove_alpha_ios: true
