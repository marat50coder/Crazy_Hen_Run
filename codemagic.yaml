workflows:
  ios-release:
    name: iOS Release → App Store Connect
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Must match the App Store Connect API key name in
    # Codemagic → Team settings → Integrations → Developer Portal.
    integrations:
      app_store_connect: CodeMagic

    environment:
      xcode: latest
      # Variable group that must exist in Codemagic → app settings →
      # Environment variables, holding IOS_DISTRIBUTION_CERT_KEY (and
      # optionally REVOKE_STALE_DISTRIBUTION_CERTS). Without this line the
      # build cannot see them.
      groups:
        - signing
      vars:
        BUNDLE_ID: com.crazyhenrun.crazyhenrungame
        APP_STORE_APPLE_ID: "6790464294"
        APPLE_TEAM_ID: SP5WD556PA
        XCODE_PROJECT: CrazyHenRun.xcodeproj
        XCODE_SCHEME: CrazyHenRun

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part-swift
          include: true

    scripts:
      - name: Set up signing
        script: |
          set -euo pipefail
          keychain initialize

          # fetch-signing-files reuses any existing Apple Distribution
          # certificate it finds on the Developer Portal — including ones
          # Codemagic never created and has no private key for, which is
          # exactly the "Cannot save Signing Certificates without
          # certificate private key" failure. Supplying our own key removes
          # the ambiguity: the tool only looks for/creates a certificate
          # that matches THIS key, so a stray old certificate can never be
          # picked by mistake.
          CERT_KEY_PATH="$CM_BUILD_DIR/ios_distribution_key.pem"
          if [ -n "${IOS_DISTRIBUTION_CERT_KEY:-}" ]; then
            echo "Reusing the stored Distribution certificate key."
            echo "$IOS_DISTRIBUTION_CERT_KEY" | base64 --decode > "$CERT_KEY_PATH"
          else
            echo "No IOS_DISTRIBUTION_CERT_KEY set yet — generating a new one."
            openssl genrsa -out "$CERT_KEY_PATH" 2048
            echo "=================================================================="
            echo "Save this as a secret variable named IOS_DISTRIBUTION_CERT_KEY"
            echo "(Codemagic → app settings → Environment variables), otherwise the"
            echo "next build will generate ANOTHER certificate and eventually hit"
            echo "Apple's 3-certificate limit:"
            echo "=================================================================="
            base64 -i "$CERT_KEY_PATH"
            echo "=================================================================="
          fi

          # Apple caps a team at a handful of active Distribution
          # certificates. Every build that generated its own key and then
          # failed left a certificate behind that nobody holds the private
          # key for, so the quota fills with dead certificates and Apple
          # answers 409 to every new request. With
          # REVOKE_STALE_DISTRIBUTION_CERTS=true we first drop the ones
          # whose public key doesn't match CERT_KEY_PATH — comparing RSA
          # moduli means a certificate we can actually sign with is never
          # touched.
          if [ "${REVOKE_STALE_DISTRIBUTION_CERTS:-false}" = "true" ]; then
            CERTS_JSON=$(app-store-connect certificates list \
              --type DISTRIBUTION IOS_DISTRIBUTION --json)
            STALE_IDS=$(python3 - "$CERTS_JSON" "$CERT_KEY_PATH" <<'PY'
          import base64, json, subprocess, sys

          certificates, key_path = json.loads(sys.argv[1]), sys.argv[2]

          def modulus(args, stdin=None):
              done = subprocess.run(args, input=stdin, capture_output=True)
              return done.stdout.decode().strip() if done.returncode == 0 else ""

          ours = modulus(["openssl", "rsa", "-in", key_path, "-noout", "-modulus"])
          for certificate in certificates:
              attributes = certificate.get("attributes", {})
              content = attributes.get("certificateContent") or attributes.get("certificate_content")
              if not content:
                  continue
              theirs = modulus(
                  ["openssl", "x509", "-inform", "DER", "-noout", "-modulus"],
                  base64.b64decode(content),
              )
              if not ours or theirs != ours:
                  print(certificate["id"])
          PY
            )
            for CERT_ID in $STALE_IDS; do
              echo "Revoking Distribution certificate $CERT_ID — no private key for it."
              app-store-connect certificates delete "$CERT_ID" --ignore-not-found
            done
          fi

          if ! app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@file:"$CERT_KEY_PATH" \
            --create; then
            echo "=================================================================="
            echo "If this failed with 409 'You already have a current Distribution"
            echo "certificate', the team's certificate quota is full. Either revoke"
            echo "the unused ones at developer.apple.com/account/resources/certificates"
            echo "or set REVOKE_STALE_DISTRIBUTION_CERTS=true for one build."
            echo "=================================================================="
            exit 1
          fi
          keychain add-certificates
          # stripSwiftSymbols is the closest thing to obfuscation on native
          # Swift: Release binary is optimized and Swift symbols are stripped
          # from the IPA. dSYMs stay uploaded for crash reports.
          xcode-project use-profiles \
            --custom-export-options='{"stripSwiftSymbols": true, "uploadSymbols": true}'

      - name: Build Release IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule STRIP_SWIFT_SYMBOLS=YES STRIP_INSTALLED_PRODUCT=YES DEPLOYMENT_POSTPROCESSING=YES COPY_PHASE_STRIP=YES DEAD_CODE_STRIPPING=YES COMPILER_INDEX_STORE_ENABLE=NO"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Uploads the IPA to App Store Connect and submits it to TestFlight.
        submit_to_testflight: true
        # Set to true only after version 1.0.4 exists in App Store Connect
        # with screenshots, description and age rating filled in — then
        # every successful build is also sent for App Store review.
        submit_to_app_store: false
