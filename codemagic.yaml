workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # TODO: replace with the exact App Store Connect integration name
      # configured in the Codemagic team settings for the Crazy Hen Run app.
      app_store_connect: Crazy Hen Run Codemagic

    environment:
      groups:
        - code-signing
      flutter: 3.44.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.crazyhenrun.crazyhenrungame
        APP_STORE_APPLE_ID: "6790464294"
        APPLE_TEAM_ID: "SP5WD556PA"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true
        - pattern: ios-gray-part
          include: true

    scripts:
      - name: Ensure GoogleService-Info.plist is present
        # The plist is committed to the repo (Firebase iOS SDK identifiers are
        # public by design and the app is protected by App Check). This step
        # is a safety net: if the file was ever removed from source control,
        # the optional GOOGLE_SERVICE_INFO_PLIST_BASE64 secret env var can
        # restore it.
        script: |
          set -euo pipefail
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            if [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
              echo "Restoring GoogleService-Info.plist from env var…"
              echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode \
                > ios/Runner/GoogleService-Info.plist
            else
              echo "ERROR: ios/Runner/GoogleService-Info.plist is missing."
              exit 1
            fi
          fi
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          # Fetch (and create if missing) the App Store distribution cert
          # + provisioning profile for the app's bundle id.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          # Compile Dart/Flutter unsigned first — this can rewrite the
          # Xcode project, so apply provisioning profiles AFTER it.
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
