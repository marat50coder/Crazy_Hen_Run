workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Crazy Hen Run Codemagic

    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.crazyhenrun.crazyhenrungame
        APP_STORE_APPLE_ID: "6790464294"
        APPLE_TEAM_ID: "SP5WD556PA"
        XCODE_PROJECT: CrazyHenRun.xcodeproj
        XCODE_SCHEME: CrazyHenRun

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part-swift
          include: true

    scripts:
      - name: Code signing & Build IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Every build lands in TestFlight automatically once it's uploaded.
        submit_to_testflight: true
        # Flip to true only after an App Store version with metadata,
        # screenshots and age rating is prepared in App Store Connect —
        # see the Codemagic guide for the exact order of steps.
        submit_to_app_store: false
