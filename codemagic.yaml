workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # TODO: replace with the exact App Store Connect integration name
      # configured in the Codemagic team settings for the Crazy Hen Run app.
      app_store_connect: Crazy Hen Run Codemagic

    environment:
      groups:
        - code-signing
      flutter: 3.44.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.crazyhenrun.crazyhenrungame
        APP_STORE_APPLE_ID: "6790464294"
        APPLE_TEAM_ID: "SP5WD556PA"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true
        - pattern: ios-gray-part
          include: true

    scripts:
      - name: Restore Firebase config (GoogleService-Info.plist)
        # GOOGLE_SERVICE_INFO_PLIST_BASE64 must be set in the Codemagic
        # environment group `code-signing` (mark as secret). It contains the
        # base64-encoded contents of ios/Runner/GoogleService-Info.plist, which
        # is intentionally not committed to this public repository.
        script: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST_BASE64 env var is not set."
            echo "Add the base64-encoded GoogleService-Info.plist to the"
            echo "'code-signing' environment group in Codemagic."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode \
            > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          # Fetch (and create if missing) the App Store distribution cert
          # + provisioning profile for the app's bundle id.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          # Compile Dart/Flutter unsigned first — this can rewrite the
          # Xcode project, so apply provisioning profiles AFTER it.
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
